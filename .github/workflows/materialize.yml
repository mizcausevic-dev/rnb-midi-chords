name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack generator
        run: |
          curl -fsSL -o source.tar.gz "https://n.uguu.se/BOfOmRQb.tar.gz"
          echo "bae6741a2ad035b99988e0ee48b0c9853094a4b1134c80cbe2383c9cea6f0447  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build pack
        run: python3 tools/build_pack.py
      - name: Commit delivered files
        run: |
          set +e
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          git status --short > /tmp/git-status.txt
          git commit -m "Materialize R&B MIDI Chords [skip ci]" > /tmp/git-commit.txt 2>&1
          commit_code=$?
          git push origin HEAD:main > /tmp/git-push.txt 2>&1
          push_code=$?
          {
            echo "### git"
            echo "commit_exit=$commit_code"
            echo '```'
            cat /tmp/git-status.txt
            echo
            cat /tmp/git-commit.txt
            echo '```'
            echo "push_exit=$push_code"
            echo '```'
            cat /tmp/git-push.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$commit_code" -eq 0 && test "$push_code" -eq 0
